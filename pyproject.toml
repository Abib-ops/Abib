[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "abib"
version = "416.08"
description = "A Bible study application"
readme = "README.md"
requires-python = ">=3.10"
# FIX: Use a simple string for the licence to avoid the deprecation warning
license = "GPL-3.0-or-later"
dependencies = [
    "PySide6>=6.6.0",
    "roman>=5.2",
    "requests>=2.31.0",
    "pywin32; sys_platform == 'win32'",
    "pywin32-ctypes==0.2.3; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pyinstaller>=6.0.0",
]

# FIX: Explicitly define which folders and files are part of your package
[tool.setuptools]
packages = ["ui", "core", "font", "domain", "images", "services"]
py-modules = ["Abib", "shared", "app", "fcs", "history", "scripture", "windows", "ui_helpers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

