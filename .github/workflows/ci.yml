name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Least-privilege token: every job only needs to read the repository contents.
permissions:
  contents: read

# Allow a running workflow to be cancelled when a newer commit is pushed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff (lint + format)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install project (with dev tooling)
        run: uv sync

      - name: Ruff lint
        run: uv run ruff check .

      # NOTE: `ruff format --check` is intentionally omitted for now. The existing
      # codebase is not yet auto-formatted, and reformatting it would create a large,
      # noisy diff that conflicts with the planned MainWindow refactor. Enable this
      # once the code has been formatted in a dedicated change.

  typecheck:
    name: Mypy (type checking)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install project (with dev tooling)
        run: uv sync

      # Type checking is currently scoped (in pyproject.toml) to the modularised
      # non-UI packages. The UI layer and the monolithic Abib.py are excluded for
      # now and will be re-added as they are cleaned up during the refactor.
      - name: Mypy
        run: uv run mypy

  test:
    name: Pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Qt system libraries (Linux)
        if: runner.os == 'Linux'
        # The runner's package mirrors occasionally fail to resolve (transient
        # DNS errors), so the whole update + install is retried a few times.
        timeout-minutes: 15
        run: |
          for attempt in 1 2 3 4; do
            if sudo apt-get update \
              && sudo apt-get install -y --no-install-recommends \
                -o Acquire::Retries=3 \
                libegl1 \
                libgl1 \
                libglib2.0-0 \
                libxkbcommon0 \
                libdbus-1-3 \
                libxcb-cursor0; then
              exit 0
            fi
            echo "apt attempt ${attempt} failed; retrying in 30 seconds..."
            sleep 30
          done
          echo "Could not install the Qt system libraries after 4 attempts."
          exit 1

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install project (with dev tooling)
        run: uv sync

      - name: Run tests with coverage
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage-${{ matrix.os }}
          path: coverage.xml
          if-no-files-found: ignore
